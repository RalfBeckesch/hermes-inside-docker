# =============================================================================
# docker-compose.yml – Hermes Agent Container (official image)
# =============================================================================
# Uses the official Hermes Docker image — no build step required.
#
# Docs: https://hermes-agent.nousresearch.com/docs/user-guide/docker
#
# Quick start:
#   1. cp examples/config.openai.yaml hermes-config/config.yaml
#   2. Set API key in ./hermes-config/.env (e.g. OPENAI_API_KEY=...)
#   3. docker compose up -d
#   4. Point your GUI client to http://host:8080
# =============================================================================
services:
  hermes:
    # Self-built image (docker build -t hermes-agent:latest .)
    # image: hermes-agent:latest

    # Official image (recommended, no build needed)
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped

    # Start gateway mode — default Hermes server (Messaging API + dashboard
    # for GUI clients). This is the image's default CMD.
    command: ["gateway", "run"]

    # s6-overlay handles zombie reaping — no init: true needed
    # (init: true would prevent s6 from becoming PID 1)

    # ---- Port mapping ----
    ports:
      - "${HERMES_PORT:-8080}:9119"

    # ---- Volumes (all configurable via .env) ----
    volumes:
      # Persistent configuration (config.yaml + .env)
      - ${HERMES_CONFIG_DIR:-./hermes-config}:/opt/data:rw

      # Optional Obsidian vault. Set VAULT_DIR in .env to your vault path.
      # When unset, a dummy directory ./vault-not-configured is created.
      - ${VAULT_DIR:-./vault-not-configured}:/hermes-vault:rw

      # Input (read-only) / Workspace (read-write)
      - ${INPUT_DIR:-./input}:/hermes-input-ro:ro
      - ${WORKSPACE_DIR:-./workspace}:/hermes-workspace-rw:rw

    # ---- Browser tools: shared memory ----
    # Playwright/Chromium needs /dev/shm >64 MB
    shm_size: 1g

    # ---- Environment ----
    environment:
      # UID/GID of the host user — files written in the container belong to you
      # Recommended: set PUID=$(id -u); PGID=$(id -g) in .env
      - PUID=${PUID:-}
      - PGID=${PGID:-}

      - HERMES_HOME=/opt/data
      - HERMES_PORT=${HERMES_PORT:-8080}
      - HERMES_DASHBOARD=true

    # ---- Security hardening ----
    # s6-overlay needs capabilities for process supervision and UID remapping.
    # We skip cap_drop — protection comes from running as the non-root hermes
    # user via s6-setuidgid after bootstrap.
    read_only: false

    # ---- Healthcheck ----
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${HERMES_PORT:-8080} 2>/dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---- One-shot interactive setup ----
  #   docker compose run --rm hermes-init setup
  hermes-init:
    image: nousresearch/hermes-agent:latest
    profiles:
      - init
    volumes:
      - ${HERMES_CONFIG_DIR:-./hermes-config}:/opt/data:rw
    environment:
      - HERMES_HOME=/opt/data
    command: ["setup"]
    stdin_open: true
